name: Build Conake OS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          set -Eeuxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          retry() {
            local attempt=1
            until "$@"; do
              local status=$?
              if [[ "$attempt" -ge 3 ]]; then
                return "$status"
              fi
              sleep "$attempt"
              attempt=$((attempt + 1))
            done
          }

          dump_apt_logs() {
            echo "apt command failed; dumping package manager logs"
            sudo tail -n 200 /var/log/apt/term.log /var/log/apt/history.log /var/log/dpkg.log || true
          }
          trap dump_apt_logs ERR

          retry sudo apt-get -o Acquire::Retries=3 update
          retry sudo apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates
          sudo add-apt-repository -y universe
          retry sudo apt-get -o Acquire::Retries=3 update
          retry sudo apt-get install -y --no-install-recommends \
            live-build xorriso squashfs-tools mtools \
            grub-pc-bin grub-efi-amd64-bin debian-archive-keyring

      - name: Build ISO
        run: ./scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: conake-os-iso
          path: dist/conake-os-v0.1-amd64.iso
          if-no-files-found: error
          retention-days: 14
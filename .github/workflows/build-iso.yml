name: Build Conake OS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build xorriso squashfs-tools mtools \
            grub-pc-bin grub-efi-amd64-bin debian-archive-keyring

      - name: Build ISO
        run: ./scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: conake-os-iso
          path: dist/conake-os-v0.1-amd64.iso
          if-no-files-found: error
          retention-days: 14
name: Build Conake OS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_ARCHIVE_KEYRING_VERSION: "2025.1"
  LIVE_BUILD_RELEASE: "20250505+deb13u1"

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Debian Live build tools
        run: |
          set -Eeuxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          retry() {
            local attempt=1
            until "$@"; do
              local status=$?
              if [[ "$attempt" -ge 3 ]]; then
                return "$status"
              fi
              sleep "$attempt"
              attempt=$((attempt + 1))
            done
          }

          dump_apt_logs() {
            echo "apt command failed; dumping package manager logs"
            sudo tail -n 200 /var/log/apt/term.log /var/log/apt/history.log /var/log/dpkg.log || true
          }
          trap dump_apt_logs ERR

          retry sudo apt-get -o Acquire::Retries=3 update
          retry sudo apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates curl gnupg
          sudo add-apt-repository -y universe
          retry sudo apt-get -o Acquire::Retries=3 update
          retry sudo apt-get install -y --no-install-recommends \
            cpio debootstrap xorriso squashfs-tools mtools \
            grub-pc-bin grub-efi-amd64-bin debian-archive-keyring

          sudo apt-get remove -y live-build || true
          live_build_deb="/tmp/live-build_${LIVE_BUILD_RELEASE}_all.deb"
          retry curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_${LIVE_BUILD_RELEASE}_all.deb" \
            --output "$live_build_deb"
          expected_live_build_version="1:${LIVE_BUILD_RELEASE}"
          package_live_build_version="$(dpkg-deb -f "$live_build_deb" Version)"
          if [[ "$package_live_build_version" != "$expected_live_build_version" ]]; then
            echo "Expected live-build $expected_live_build_version, got $package_live_build_version" >&2
            exit 1
          fi
          sudo dpkg -i "$live_build_deb"
          installed_live_build_version="$(dpkg-query -W -f='${Version}' live-build)"
          if [[ "$installed_live_build_version" != "$expected_live_build_version" ]]; then
            echo "Expected installed live-build $expected_live_build_version, got $installed_live_build_version" >&2
            exit 1
          fi
          dpkg-query -W -f='live-build ${Version}\n' live-build

          keyring_deb="/tmp/debian-archive-keyring_${DEBIAN_ARCHIVE_KEYRING_VERSION}_all.deb"
          retry curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_${DEBIAN_ARCHIVE_KEYRING_VERSION}_all.deb" \
            --output "$keyring_deb"
          keyring_extract=/tmp/debian-archive-keyring-package
          dpkg-deb -x "$keyring_deb" "$keyring_extract"
          expected_fingerprint=04B54C3CDCA79751B16BC6B5225629DF75B188BD
          if ! gpg --show-keys --with-colons \
            "$keyring_extract/usr/share/keyrings/debian-archive-keyring.gpg" 2>/dev/null \
            | awk -F: '$1 == "fpr" { print $10 }' \
            | grep -Fx "$expected_fingerprint" >/dev/null; then
            echo "Debian Trixie keyring is missing expected fingerprint $expected_fingerprint" >&2
            exit 1
          fi
          sudo dpkg -i "$keyring_deb"
          curl --fail --silent --show-error --location \
            https://deb.debian.org/debian/dists/trixie/InRelease \
            --output /tmp/trixie-InRelease
          gpgv --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
            /tmp/trixie-InRelease

      - name: Build ISO
        run: ./scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: conake-os-iso
          path: dist/conake-os-v0.1-amd64.iso
          if-no-files-found: error
          retention-days: 14